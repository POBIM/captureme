[package]
name = "captureme"
version = "0.1.0"
description = "CaptureME – screenshot & annotation tool for macOS"
edition = "2021"

[lib]
name = "captureme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
xcap = "0.9"
arboard = { version = "3", features = ["image-data"] }
base64 = "0.22"
dirs = "6"
# ---- Agent A deps ----
# ---- Agent C deps ----
# ---- Agent D deps ----

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-vision = "0.3"
objc2-core-graphics = "0.3"
core-graphics = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
